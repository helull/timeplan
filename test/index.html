<header><span><b>Min Timeplan</b> <span class="test">TEST · eksempeldata</span></span><select id="mode" aria-label="Visning"><option>Begge</option><option>Rom</option><option>Lærer</option><option>Ingen</option></select></header><main class="days" id="days"></main><footer id="nav"></footer><dialog id="detail"><h3 id="title"></h3><p id="body"></p><button onclick="detail.close()">Lukk</button></dialog>
<script>
const subjects=['Matematikk S1','Norsk','Engelsk','Naturfag','Historie','Kroppsøving','Klassens time'],colors=['#527caa','#aa7957','#8878ae','#57917d','#846b9b','#80934e','#57917d'],names=['Helge Ullern','Kari Nordmann','Ola Hansen','Anne Berg','Per Olsen','Eva Dahl','Kari Nordmann'];
const data=[[[0,90,0,7],[105,195,1,1],[240,330,2,2],[345,435,4,0]],[[0,90,1,1],[105,195,0,15],[240,285,5,3],[285,315,6,1],[330,420,3,4]],[[105,195,0,7],[240,330,4,0]],[[0,90,2,1],[105,195,3,2],[240,330,1,1],[345,435,0,3]],[[0,90,0,1],[105,195,2,35],[240,285,1,19]]];
const time=m=>String(Math.floor((495+m)/60)).padStart(2,'0')+':'+String((495+m)%60).padStart(2,'0');
let active=0;const days=document.getElementById('days'),nav=document.getElementById('nav');function show(i){active=(i+5)%5;[...days.children].forEach((d,j)=>d.classList.toggle('active',j===active));[...nav.children].forEach((b,j)=>b.style.color=j===active?'#175c40':'#94a3b8')}
function openDetail(s,t){if(matchMedia('(orientation:landscape) and (max-width:1000px)').matches)return;document.getElementById('title').textContent=s;document.getElementById('body').textContent=t;document.getElementById('detail').showModal()}
data.forEach((list,i)=>{const d=document.createElement('section');d.className='day';d.innerHTML='<div class="heading">'+['Mandag','Tirsdag','Onsdag','Torsdag','Fredag'][i]+'<small>UKE '+(()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+3-(d.getDay()+6)%7);const j=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-j)/86400000-3+(j.getDay()+6)%7)/7)})()+'</small></div><div class="timeline"></div>';const grid=d.lastChild;for(let m=45;m<=405;m+=60){const line=document.createElement('div');line.className='line';line.style.top=m/465*100+'%';grid.append(line)}list.forEach(([a,b,s,flags])=>{const card=document.createElement('article');card.className='lesson'+(flags&8?' exam':'');card.style.cssText='top:'+a/465*100+'%;height:'+(b-a)/465*100+'%;background:'+colors[s];const name=names[s],initials=name.split(' ').map(n=>n[0]).join('');card.innerHTML='<div class="top"><span class="subject">'+subjects[s]+'</span><span class="room">B'+(214+s)+'</span><span class="time">'+time(a)+'</span></div><div class="teacher"><span class="fullname">'+name+'</span><span class="initials">'+initials+'</span></div><div class="notes"></div><div class="marks"></div><div class="icons"></div>';const notes=card.querySelector('.notes'),marks=card.querySelector('.marks'),icons=card.querySelector('.icons');function note(cls,label,txt){const n=document.createElement('button');n.className='note '+cls;n.textContent=txt;n.onclick=()=>openDetail(label,txt);notes.append(n);const mark=document.createElement('button');mark.type='button';mark.onclick=()=>openDetail(label,txt);mark.className='mark '+cls;mark.textContent=cls==='yellow'?'▤':'✎';mark.setAttribute('aria-label',label);marks.append(mark)}if(flags&1)note('yellow','Lærerlekse','Gjør oppgave 3.12–3.18');if(flags&2)note('blue','Egen lekse','Husk kalkulator!');if(flags&4){marks.insertAdjacentHTML('beforeend','<span class="mark" aria-label="Fremdriftsplan"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7c-3-3-7-3-10-2v14c4-1 7 0 10 2 3-2 6-3 10-2V5c-3-1-7-1-10 2zM12 7v14"/></svg></span>');const p=document.createElement('button');p.innerHTML='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7c-3-3-7-3-10-2v14c4-1 7 0 10 2 3-2 6-3 10-2V5c-3-1-7-1-10 2zM12 7v14"/></svg>';p.title='Fremdriftsplan';p.onclick=()=>openDetail('Fremdriftsplan','Eksempel: repetisjon og oppgaver');icons.append(p)}if(flags&56){card.classList.add('exam');if(!(flags&8))card.classList.add('student');card.querySelector('.top').insertAdjacentHTML('beforeend','<span class="examtag '+(flags&8?'':'student')+'">'+(flags&8?'Prøve':flags&16?'Prøve (elev)':'Annen vurdering')+'</span>')}if(b-a===30)card.classList.add('half');const edit=document.createElement('button');edit.className='edit';edit.innerHTML='<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5 4 4M4 20l4-1 13-13-4-4L4 15z"/></svg>';edit.title='Redigering (kun demonstrasjon)';edit.onclick=()=>openDetail('Test','Ingen data lagres i denne demonstrasjonen.');icons.append(edit);grid.append(card)});days.append(d);const btn=document.createElement('button');btn.textContent='●';btn.setAttribute('aria-label',['Mandag','Tirsdag','Onsdag','Torsdag','Fredag'][i]);btn.onclick=()=>show(i);nav.append(btn)});show(0);const resize=new ResizeObserver(entries=>{for(const e of entries)e.target.classList.toggle('compact',e.contentRect.height<76)});document.querySelectorAll('.lesson').forEach(c=>resize.observe(c));function updateNow(){document.querySelectorAll('.nowline').forEach(n=>n.remove());const now=new Date(),day=now.getDay(),m=now.getHours()*60+now.getMinutes()-495;if(day<1||day>5||m<0||m>465)return;const line=document.createElement('div');line.className='nowline';line.style.top=m/465*100+'%';days.children[day-1].querySelector('.timeline').prepend(line)}updateNow();setInterval(updateNow,60000);document.getElementById('mode').onchange=e=>{document.body.classList.toggle('hide-room',!['Begge','Rom'].includes(e.target.value));document.body.classList.toggle('hide-teacher',!['Begge','Lærer'].includes(e.target.value))};let x=0;days.addEventListener('touchstart',e=>x=e.touches[0].clientX,{passive:true});days.addEventListener('touchend',e=>{let delta=e.changedTouches[0].clientX-x;if(Math.abs(delta)>45)show(active+(delta<0?1:-1))},{passive:true});
