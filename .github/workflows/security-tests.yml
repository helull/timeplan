name: Firestore security tests
on:
  push:
    branches: [security/firebase-auth, security/teacher-approval, security/password-recovery, feature/student-device-pairing]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save firebase@12.3.0 @firebase/rules-unit-testing@5 firebase-tools@14
      - run: |
          printf '%s\n' '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"port":8080},"ui":{"enabled":false}}}' > firebase.test.json
          npx firebase emulators:exec --only firestore --project demo-timeplan-security --config firebase.test.json "node --test security-tests/rules.test.mjs"
      - name: JavaScript syntax checks
        run: |
          for file in *.js; do node --input-type=module --check < "$file" || exit 1; done
