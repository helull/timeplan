<!DOCTYPE html>
<html lang="no">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Lærergodkjenning</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f3f4f6;
        }

        header {

            background: #1e40af;

            color: white;

            padding: 16px;

            text-align: center;

            font-size: 22px;

            font-weight: bold;

            box-shadow:
                0 2px 6px
                rgba(0,0,0,.15);
        }

        #requests {

            max-width: 700px;

            margin: auto;

            padding: 12px;
        }

        .request-card {

            background: white;

            border-radius: 12px;

            padding: 16px;

            margin-bottom: 12px;

            box-shadow:
                0 2px 6px
                rgba(0,0,0,.1);
        }

        .request-card h3 {

            margin: 0 0 8px 0;

            font-size: 18px;
        }

        .request-card p {

            margin: 6px 0;

            color: #555;

            word-break: break-word;
        }

        .approve-button {

            margin-top: 12px;

            width: 100%;

            height: 50px;

            border: none;

            border-radius: 8px;

            background: #16a34a;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .approve-button:active {

            opacity: 0.8;
        }

        .empty-message {

            text-align: center;

            margin-top: 40px;

            color: #777;

            font-size: 18px;
        }

    </style>

</head>

<body>

    <header>

        Lærergodkjenning

    </header>

    <div id="requests">

        <div class="empty-message">

            Laster forespørsler ...

        </div>

    </div>

    <script
        type="module"
        src="./admin.js">
    </script>

</body>

</html>
