<!DOCTYPE html>
<html lang="no">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Timeplan</title>

<link
rel="stylesheet"
href="style.css">

</head>
<body>

<div class="weeks">

    <section
        class="week active"
        data-week="42">

        <div class="days">

            <article class="day" data-day="1"></article>
            <article class="day" data-day="2"></article>
            <article class="day" data-day="3"></article>
            <article class="day" data-day="4"></article>
            <article class="day" data-day="5"></article>

        </div>

    </section>

    <section
        class="week"
        data-week="43">

        <div class="days">

            <article class="day" data-day="1"></article>
            <article class="day" data-day="2"></article>
            <article class="day" data-day="3"></article>
            <article class="day" data-day="4"></article>
            <article class="day" data-day="5"></article>

        </div>

    </section>

    <section
        class="week"
        data-week="44">

        <div class="days">

            <article class="day" data-day="1"></article>
            <article class="day" data-day="2"></article>
            <article class="day" data-day="3"></article>
            <article class="day" data-day="4"></article>
            <article class="day" data-day="5"></article>

        </div>

    </section>

</div>

<div class="dots">

    <span class="dot active"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>

</div>

<script
type="module"
src="app.js"></script>

</body>
</html>
